<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0f172a;font-family:'Inter';color:#fff;position:relative;overflow:hidden}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#2563eb55,transparent 65%);top:300px;left:300px}
.top{position:absolute;top:70px;left:70px;right:70px}
.kicker{display:inline-block;background:#f59e0b;color:#0f172a;font-weight:800;font-size:26px;padding:10px 20px;border-radius:999px;letter-spacing:.5px}
h1{font-family:'Inter Display';font-weight:900;font-size:80px;line-height:1;margin-top:28px;letter-spacing:-2px}
h1 span{color:#60a5fa}
.stack{position:absolute;left:70px;top:520px;width:360px;height:420px}
.ph{position:absolute;width:300px;height:200px;border-radius:18px;background-size:cover;background-position:center;border:5px solid #fff;box-shadow:0 20px 40px #0008}
.p1{top:0;left:0;transform:rotate(-6deg);background-image:url(stock/p106399.jpg)}
.p2{top:120px;left:40px;transform:rotate(4deg);background-image:url(stock/p1571460.jpg)}
.p3{top:240px;left:10px;transform:rotate(-3deg);background-image:url(stock/p2724749.jpg)}
.lab{position:absolute;font-weight:800;font-size:28px;color:#cbd5e1;letter-spacing:1px}
.l1{left:70px;top:470px}.l2{left:660px;top:470px}
.arrow{position:absolute;left:430px;top:690px;font-size:120px;font-weight:900;color:#f59e0b}
.phone{position:absolute;left:600px;top:515px;width:340px;height:604px;border-radius:44px;background:#000;border:10px solid #1e293b;box-shadow:0 30px 60px #000a;overflow:hidden}
.screen{position:absolute;inset:0;background:url(stock/p1571460.jpg) center/cover;transform:scale(1.25)}
.play{position:absolute;left:50%;top:44%;width:110px;height:110px;margin-left:-55px;border-radius:50%;background:#ffffffe6;}
.play:after{content:'';position:absolute;left:42px;top:30px;border-left:40px solid #0f172a;border-top:25px solid transparent;border-bottom:25px solid transparent}
.bar{position:absolute;bottom:40px;left:24px;right:24px;height:8px;border-radius:4px;background:#ffffff55}
.bar i{display:block;width:62%;height:100%;background:#f59e0b;border-radius:4px}
.cap{position:absolute;bottom:62px;left:24px;right:24px;font-weight:800;font-size:24px;text-shadow:0 2px 8px #000}
.bottom{position:absolute;left:70px;right:70px;bottom:70px}
.chk{font-size:32px;font-weight:600;margin:10px 0;color:#e2e8f0}
.chk b{color:#22c55e;margin-right:12px}
.cta{margin-top:26px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#f59e0b;color:#0f172a;font-weight:900;font-size:34px;padding:22px 36px;border-radius:16px}
.url{font-weight:800;font-size:30px;color:#94a3b8}
</style></head><body>
<div class="glow"></div>
<div class="top"><div class="kicker">PARA PROFESIONALES INMOBILIARIOS</div>
<h1>Fotos de tu propiedad.<br><span>Video con IA.</span></h1></div>
<div class="lab l1">1. SUBE TUS FOTOS</div><div class="lab l2">2. RECIBE EL VIDEO</div>
<div class="stack"><div class="ph p1"></div><div class="ph p2"></div><div class="ph p3"></div></div>
<div class="arrow">→</div>
<div class="phone"><div class="screen"></div><div class="play"></div><div class="cap">Recorrido con IA</div><div class="bar"><i></i></div></div>
<div class="bottom">
<div class="chk"><b>✓</b>Listo en menos de 5 minutos</div>
<div class="chk"><b>✓</b>Vertical para Reels. Horizontal para portales y YouTube</div>
<div class="cta"><div class="btn">Empieza gratis · sin tarjeta</div><div class="url">photoaivideo.com</div></div>
</div></body></html>
